services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "18830:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  node-red:
    build: .
    depends_on:
      - mosquitto
    ports:
      - "18800:1880"
    volumes:
      - ./.run/flows.json:/data/flows.json
